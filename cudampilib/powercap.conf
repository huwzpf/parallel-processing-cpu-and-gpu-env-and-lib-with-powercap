# Example power capping configuration
# strategy can be DISABLED, CONTINOUS_EQUAL, EQUAL_SPLIT, BINARY_GREEDY,
# EDP_GRADIENT_SIMPLE, EDP_GRADIENT_SPSA, EDP_GRADIENT_SPSA_ADAPTIVE,
# EDP_GRADIENT_SIMPLE_ADAPTIVE, or EDP_GRADIENT_CMAES
strategy=DISABLED

# cpu_min_powercap and gpu_min_powercap are used for CONTINOUS_EQUAL strategy
cpu_min_powercap=0.1
gpu_min_powercap=0.1

# Optional global power cap in Watts (applies for strategies that use a global limit).
# If set (>0), enables global power capping. Set to 0 to disable.
global_powercap=850

# Gradient optimisation settings (used for EDP_GRADIENT_* strategies)
# start_powercap is the initial cap position within the device range [min,max] expressed as fraction
start_powercap=0.2
# Learning-rate schedule and finite-difference/perturbation step
start_alpha=100.0
alpha_decay=0.93
epsilon_decay=0.98
gradient_opt_eps=10.0

# CPU time window for power capping in microseconds (default: 1000000 = 1s)
cpu_time_window_us=500000
